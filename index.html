<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CBC &amp; Mianbao Ballistic Calculator</title>
    <link rel="stylesheet" href="styles.css?v=20260820-manual1">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow" data-i18n="eyebrow">Create: Big Cannons</p>
          <h1 data-i18n="title">Ballistic calculator</h1>
        </div>
        <div class="lang-switch" aria-label="Language">
          <button type="button" data-lang="en">EN</button>
          <button type="button" data-lang="ru">RU</button>
          <button type="button" data-lang="uk">UA</button>
        </div>
      </header>

      <section class="layout">
        <form id="calcForm" class="panel input-panel">
          <div class="section-head">
            <h2 data-i18n="shotSetup">Shot setup</h2>
            <button class="ghost" type="button" id="resetBtn" data-i18n="reset">Reset</button>
          </div>

          <label>
            <span data-i18n="calculatorType">Ballistics system</span>
            <select id="calculatorType">
              <option value="cbc">Create: Big Cannons</option>
              <option value="mianbao">Mianbao Modern Warfare</option>
            </select>
          </label>

          <div class="grid two cbc-only">
            <label>
              <span data-i18n="barrelLength">Total cannon length</span>
              <input id="length" type="number" min="0" step="0.1" value="8">
              <small data-i18n="blocks">blocks / meters</small>
            </label>
            <label>
              <span data-i18n="velocityMps">Projectile speed</span>
              <input id="speedMps" type="number" min="0" step="1" value="160">
              <small data-i18n="mpsHint">m/s</small>
            </label>
          </div>

          <label class="cbc-only">
            <span data-i18n="method">Method</span>
            <select id="method">
              <option value="new">New Ballistics.lua</option>
              <option value="realistic">CBC Realistic Ballistics</option>
            </select>
          </label>

          <label class="cbc-only">
            <span data-i18n="projectileType">Projectile type</span>
            <select id="projectile"></select>
          </label>

          <div class="grid two method-realistic">
            <label>
              <span data-i18n="cannonType">Cannon</span>
              <select id="cannonProfile"></select>
              <small data-i18n="cannonVariantsHint">All equivalent material variants are grouped</small>
            </label>
            <label class="seed-coordinate-only">
              <span data-i18n="worldSeed">World seed</span>
              <input id="worldSeed" type="text" inputmode="numeric" value="0">
              <small data-i18n="worldSeedHint">Required for the exact static wind field</small>
            </label>
          </div>

          <div id="mianbaoSetup" class="mianbao-only" hidden>
            <div class="grid two">
              <label>
                <span data-i18n="rocketLauncher">Rocket launcher</span>
                <select id="rocketLauncher"></select>
              </label>
              <label>
                <span data-i18n="rocketType">Rocket type</span>
                <select id="rocketMode"></select>
              </label>
            </div>
            <div class="grid two">
              <label>
                <span data-i18n="missileLifetime">Missile lifetime</span>
                <input id="missileLifetime" type="number" min="0.05" step="1" value="600">
                <small data-i18n="secondsHint">seconds; must match the Mianbao lifetime config</small>
              </label>
              <label>
                <span data-i18n="rangeCorrection">Aim range correction</span>
                <input id="rocketCompensation" type="number" step="1" value="0">
                <small data-i18n="rangeCorrectionHint">added to the ballistic distance, in meters</small>
              </label>
            </div>
          </div>

          <div class="grid two">
            <label>
              <span data-i18n="distance">Horizontal distance</span>
              <input id="distance" type="number" min="0" step="1" value="300">
              <small data-i18n="distanceHint">from cannon to target</small>
            </label>
            <label>
              <span data-i18n="heightDelta">Target height delta</span>
              <input id="heightDelta" type="number" step="1" value="0">
              <small data-i18n="heightHint">target Y minus cannon Y</small>
            </label>
          </div>

          <label class="check" style="align-items:center;">
            <input id="useCoords" type="checkbox">
            <span data-i18n="useCoordinates">Use coordinates</span>
          </label>

          <div id="coordsGroup" style="display:none;">
            <div class="grid two">
              <label>
                <span data-i18n="cannonCoords">Cannon (X,Y,Z)</span>
                <div style="display:flex;gap:8px;">
                  <input id="cannonX" type="number" step="0.1" value="0" placeholder="X">
                  <input id="cannonY" type="number" step="0.1" value="0" placeholder="Y">
                  <input id="cannonZ" type="number" step="0.1" value="0" placeholder="Z">
                </div>
              </label>
              <label>
                <span data-i18n="targetCoords">Target (X,Y,Z)</span>
                <div style="display:flex;gap:8px;">
                  <input id="targetX" type="number" step="0.1" value="300" placeholder="X">
                  <input id="targetY" type="number" step="0.1" value="0" placeholder="Y">
                  <input id="targetZ" type="number" step="0.1" value="0" placeholder="Z">
                </div>
              </label>
            </div>
          </div>

          <details class="details">
            <summary>
              <span data-i18n="details">Detailed config</span>
              <span class="chevron">+</span>
            </summary>

            <div class="detail-grid">
              <label>
                <span data-i18n="preferArc">Preferred arc</span>
                <select id="preferArc">
                  <option value="low" data-i18n="lowArc">Low</option>
                  <option value="high" data-i18n="highArc">High</option>
                </select>
              </label>
              <label>
                <span data-i18n="amin">Minimum pitch</span>
                <input id="amin" type="number" step="0.1" value="-30">
              </label>
              <label>
                <span data-i18n="amax">Maximum pitch</span>
                <input id="amax" type="number" step="0.1" value="60">
              </label>
              <label class="cbc-only">
                <span data-i18n="gravity">Gravity</span>
                <input id="gravity" type="number" step="0.001" value="0.05">
              </label>
              <label class="cbc-only">
                <span data-i18n="drag">Drag</span>
                <input id="drag" type="number" step="0.001" value="0.99">
              </label>

              <label class="method-realistic"><span>Dimension ID</span><input id="dimensionId" type="text" value="minecraft:overworld"></label>
              <label class="method-realistic"><span>Weather</span><select id="weatherMode"><option value="clear">Clear</option><option value="rain">Rain</option><option value="thunder">Thunder</option></select></label>
              <label class="method-realistic"><span>Biome temperature</span><input id="biomeTemperature" type="number" step="0.01" value="0.8"></label>
              <label class="method-realistic"><span>CBC durability mass</span><input id="referenceMass" type="number" min="0" step="0.1" value="2"></label>
              <label class="method-realistic"><span>Projectile diameter (m)</span><input id="projectileDiameter" type="number" min="0.01" step="0.01" value="0.8"></label>
              <label class="method-realistic"><span>Base drag coefficient</span><input id="realisticCd" type="number" min="0" step="0.01" value="0.25"></label>
              <label class="method-realistic"><span>Gravity (m/s²)</span><input id="realisticGravity" type="number" min="0" step="0.00001" value="9.80665"></label>
              <label class="method-realistic"><span>Sea-level Y</span><input id="seaLevelY" type="number" step="1" value="64"></label>
              <label class="method-realistic"><span>Atmospheric scale height (m)</span><input id="scaleHeight" type="number" min="100" step="100" value="8500"></label>
              <label class="method-realistic"><span>Projectile density (kg/m³)</span><input id="projectileDensity" type="number" min="100" step="100" value="7800"></label>
              <label class="method-realistic"><span>Length in calibres</span><input id="lengthCalibers" type="number" min="0.5" step="0.1" value="3"></label>
              <label class="method-realistic"><span>Solid fraction</span><input id="solidFraction" type="number" min="0.05" max="1" step="0.01" value="0.5"></label>
              <label class="method-realistic check"><input id="realisticWindEnabled" type="checkbox" checked><span>Enable static wind</span></label>
              <label class="method-realistic"><span>Clear wind speed (m/s)</span><input id="windSpeed" type="number" min="0" step="0.1" value="4"></label>
              <label class="method-realistic"><span>Wind direction (°; 0=+Z)</span><input id="windDirection" type="number" step="0.1" value="35"></label>
              <label class="method-realistic"><span>Spatial gust amplitude (m/s)</span><input id="gustSpeed" type="number" min="0" step="0.1" value="3"></label>
              <label class="method-realistic check"><input id="weatherAffectsWind" type="checkbox" checked><span>Weather affects wind</span></label>
              <label class="method-realistic"><span>Wind region size (m)</span><input id="windRegionSize" type="number" min="16" step="16" value="2048"></label>
              <label class="method-realistic seed-coordinate-only"><span>Wind seed salt</span><input id="windSeedSalt" type="text" inputmode="numeric" value="0"></label>
              <label class="method-realistic"><span>Direction variation (°)</span><input id="windDirectionVariation" type="number" min="0" max="180" step="1" value="45"></label>
              <label class="method-realistic"><span>Speed variation fraction</span><input id="windSpeedVariation" type="number" min="0" max="1" step="0.01" value="0.35"></label>
              <label class="method-realistic"><span>Rain wind bonus (m/s)</span><input id="rainWindBonus" type="number" min="0" step="0.1" value="5"></label>
              <label class="method-realistic"><span>Thunder wind bonus (m/s)</span><input id="thunderWindBonus" type="number" min="0" step="0.1" value="7"></label>
              <label class="method-realistic"><span>Rain gust bonus (m/s)</span><input id="rainGustBonus" type="number" min="0" step="0.1" value="2"></label>
              <label class="method-realistic"><span>Thunder gust bonus (m/s)</span><input id="thunderGustBonus" type="number" min="0" step="0.1" value="5"></label>
              <label class="method-realistic"><span>Vertical turbulence fraction</span><input id="verticalTurbulence" type="number" min="0" step="0.01" value="0.04"></label>
              <label class="method-realistic"><span>High-altitude wind multiplier</span><input id="altitudeWindMultiplier" type="number" min="1" step="0.05" value="1.55"></label>
              <label class="method-realistic check"><input id="enableCoriolis" type="checkbox" checked><span>Enable Coriolis</span></label>
              <label class="method-realistic"><span>Latitude (°)</span><input id="latitude" type="number" min="-90" max="90" step="0.1" value="45"></label>
              <label class="method-realistic check"><input id="enableSpinDrift" type="checkbox" checked><span>Enable spin drift</span></label>
              <label class="method-realistic"><span>Spin-drift factor</span><input id="spinDriftFactor" type="number" step="0.001" value="0.02"></label>
              <label class="cbc-only">
                <span data-i18n="maxDelta">Max time error</span>
                <input id="maxDelta" type="number" step="0.01" value="1">
              </label>
              <label class="cbc-only">
                <span data-i18n="maxSteps">Max ticks</span>
                <input id="maxSteps" type="number" min="1" step="1" value="10000">
              </label>
              <label class="cbc-only">
                <span data-i18n="iterations">Refine iterations</span>
                <input id="iterations" type="number" min="1" step="1" value="5">
              </label>
              <label class="cbc-only">
                <span data-i18n="elements">Samples per refine</span>
                <input id="elements" type="number" min="2" step="1" value="20">
              </label>
              <label class="check cbc-only">
                <input id="checkImpossible" type="checkbox" checked>
                <span data-i18n="checkImpossible">Reject impossible results</span>
              </label>
            </div>
          </details>

          <button class="calculate-primary method-realistic" type="button" id="calculateBtn" data-i18n="calculate">Calculate</button>
        </form>

        <section class="panel output-panel">
          <div class="section-head">
            <h2 data-i18n="result">Result</h2>
            <span id="status" class="status"></span>
          </div>

          <div class="solution-card primary">
            <span data-i18n="chosenPitch">Chosen pitch</span>
            <strong id="chosenPitch">-</strong>
          </div>

          <div class="metrics">
            <div>
              <span data-i18n="lowSolution">Low solution</span>
              <strong id="lowPitch">-</strong>
            </div>
            <div>
              <span data-i18n="highSolution">High solution</span>
              <strong id="highPitch">-</strong>
            </div>
            <div class="method-realistic">
              <span data-i18n="lowYaw">Low yaw</span>
              <strong id="lowYaw">-</strong>
            </div>
            <div class="method-realistic">
              <span data-i18n="highYaw">High yaw</span>
              <strong id="highYaw">-</strong>
            </div>
            <div>
              <span data-i18n="currentDistance">Current distance</span>
              <strong id="currentDistance">-</strong>
            </div>
            <div>
              <span data-i18n="maxDistance">Max distance</span>
              <strong id="maxDistance">-</strong>
            </div>
            <div>
              <span data-i18n="flightTime">Flight time</span>
              <strong id="flightTime">-</strong>
            </div>
            <div>
              <span data-i18n="speedBpt">Speed</span>
              <strong id="speedBpt">-</strong>
            </div>
            <div>
              <span data-i18n="yaw">Yaw</span>
              <strong id="yaw">-</strong>
            </div>
            <div>
              <span data-i18n="usedMethod">Used method</span>
              <strong id="usedMethod">-</strong>
            </div>
          </div>

          <canvas id="trajectory" width="900" height="360" aria-label="Trajectory preview"></canvas>
          <pre id="debug"></pre>
        </section>
      </section>
    </main>
    <script src="mianbao_ballistics.js?v=20260815-4"></script>
    <script src="cbc_realistic_ballistics.js?v=20260820-dualarc4"></script>
    <script src="app.js?v=20260820-dualarc4"></script>
  </body>
</html>
