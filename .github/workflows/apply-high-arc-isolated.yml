name: Apply isolated Realistic high arc fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Save baseline physics
        run: cp cbc_realistic_ballistics.js /tmp/cbc_realistic_ballistics.before.js

      - name: Apply isolated high-arc patch
        run: python3 .github/apply_high_arc_isolated_fix.py

      - name: Validate syntax and isolation
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check cbc_realistic_ballistics.js
          grep -q 'REALISTIC_HIGH_ARC_ISOLATED_20260820_V1' cbc_realistic_ballistics.js
          grep -Fq 'lowScanMax=Math.min(c.maxPitch,60)' cbc_realistic_ballistics.js
          grep -Fq 'p+=.25' cbc_realistic_ballistics.js
          grep -Fq 'Math.max(10000,c.maxTicks||0)' cbc_realistic_ballistics.js
          grep -Fq 'realisticMode = calculatorType === "cbc" && $("method")?.value === "realistic"' app.js

      - name: Verify old low arc is unchanged
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          function load(path) {
            const ctx = { window: {} };
            vm.createContext(ctx);
            vm.runInContext(fs.readFileSync(path, 'utf8'), ctx);
            return ctx.window.CBCRealisticBallistics;
          }
          const before = load('/tmp/cbc_realistic_ballistics.before.js');
          const after = load('cbc_realistic_ballistics.js');
          const base = {
            worldSeed: '0', seedSalt: '0', dimensionId: 'minecraft:overworld',
            weather: 'clear', biomeTemperature: 0.8, referenceMass: 6,
            diameter: 0.875, cd: 0.22, gravity: 9.80665, seaLevelY: 64,
            scaleHeight: 8500, projectileDensity: 7800, lengthCalibers: 3,
            solidFraction: 0.5, windEnabled: false, windSpeed: 0,
            windDirection: 0, gustSpeed: 0, weatherAffectsWind: false,
            windRegionSize: 2048, windDirectionVariation: 0,
            windSpeedVariation: 0, rainWindBonus: 0, thunderWindBonus: 0,
            rainGustBonus: 0, thunderGustBonus: 0, verticalTurbulence: 0,
            altitudeWindMultiplier: 1, enableCoriolis: false, latitude: 45,
            enableSpinDrift: false, spinDriftFactor: 0, minPitch: -30,
            maxPitch: 60, maxTicks: 1200, allowedMiss: 1
          };
          const starts = [[0,64,0],[120,80,-40]];
          const targets = [[500,64,0],[1000,80,0],[2000,64,500],[3000,100,-250]];
          let checked = 0;
          for (const S of starts) for (const T of targets) {
            const a = before.solve(S,T,20,{...base},'low');
            const b = after.solve(S,T,20,{...base},'low');
            const ap = a.low?.pitchDeg;
            const bp = b.low?.pitchDeg;
            if (Number.isFinite(ap) || Number.isFinite(bp)) {
              if (!(Number.isFinite(ap) && Number.isFinite(bp) && Math.abs(ap-bp) < 1e-12)) {
                throw new Error(`Low arc changed for ${JSON.stringify({S,T,ap,bp})}`);
              }
              checked++;
            }
          }
          if (!checked) throw new Error('No reachable low-arc validation cases');
          console.log(`Low-arc equivalence passed on ${checked} reachable cases.`);
          NODE

      - name: Verify a separate high arc can be found
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const ctx = { window: {} };
          vm.createContext(ctx);
          vm.runInContext(fs.readFileSync('cbc_realistic_ballistics.js','utf8'), ctx);
          const physics = ctx.window.CBCRealisticBallistics;
          const config = {
            worldSeed: '0', seedSalt: '0', dimensionId: 'minecraft:overworld',
            weather: 'clear', biomeTemperature: 0.8, referenceMass: 6,
            diameter: 0.875, cd: 0.22, gravity: 9.80665, seaLevelY: 64,
            scaleHeight: 8500, projectileDensity: 7800, lengthCalibers: 3,
            solidFraction: 0.5, windEnabled: false, windSpeed: 0,
            windDirection: 0, gustSpeed: 0, weatherAffectsWind: false,
            windRegionSize: 2048, windDirectionVariation: 0,
            windSpeedVariation: 0, rainWindBonus: 0, thunderWindBonus: 0,
            rainGustBonus: 0, thunderGustBonus: 0, verticalTurbulence: 0,
            altitudeWindMultiplier: 1, enableCoriolis: false, latitude: 45,
            enableSpinDrift: false, spinDriftFactor: 0, minPitch: -30,
            maxPitch: 89, maxTicks: 1200, allowedMiss: 1
          };
          let found = null;
          for (const d of [200,300,500,750,1000,1500,2000,3000,4000]) {
            const r = physics.solve([0,64,0],[d,64,0],20,{...config},'high');
            if (r.high && r.high.pitchDeg > 60 && r.high.miss <= Math.max(1,config.allowedMiss)) {
              found = { distance: d, low: r.low?.pitchDeg, high: r.high.pitchDeg };
              break;
            }
          }
          if (!found) throw new Error('Dedicated >60 degree high arc was not found in validation cases');
          console.log('High-arc validation:', found);
          NODE

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js cbc_realistic_ballistics.js index.html
          git commit -m 'Restore isolated high-arc search without changing low arc'
          git push
