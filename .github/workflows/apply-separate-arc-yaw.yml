name: Apply separate Realistic arc yaw

on:
  push:
    branches: [main]
    paths:
      - '.github/apply_separate_arc_yaw.py'
      - '.github/workflows/apply-separate-arc-yaw.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply UI patch
        run: python3 .github/apply_separate_arc_yaw.py
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check cbc_realistic_ballistics.js
          grep -q 'REALISTIC_SEPARATE_ARC_YAW_20260820_V1' app.js
          grep -q 'id="lowYaw"' index.html
          grep -q 'id="highYaw"' index.html
          grep -q 'motorYawForRealisticSolution(result.high)' app.js
          grep -q 'motorYawForRealisticSolution(result.low)' app.js
          grep -q 'REALISTIC_HIGH_ARC_ISOLATED_20260820_V1' cbc_realistic_ballistics.js
          git diff --exit-code -- cbc_realistic_ballistics.js
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html
          git commit -m 'Show separate yaw for low and high Realistic arcs'
          git push
