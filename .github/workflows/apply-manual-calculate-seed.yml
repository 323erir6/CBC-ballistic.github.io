name: Apply manual Calculate and coordinate seed UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-manual-calculate-seed.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve exact realistic physics blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object cbc_realistic_ballistics.js)" = "9b7f8a5c7223cd996901b2554d459b27e98589cf"

      - name: Apply UI-only patch
        run: python3 .github/apply_manual_calculate_seed_mode.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          test "$(git hash-object cbc_realistic_ballistics.js)" = "9b7f8a5c7223cd996901b2554d459b27e98589cf"
          grep -Fq 'result = physics.solve(cannon, target, opts.speedBpt, config, opts.preferArc);' app.js
          grep -Fq 'worldSeed: opts.useCoords ? $("worldSeed").value : "0"' app.js
          grep -Fq 'seedSalt: opts.useCoords ? $("windSeedSalt").value : "0"' app.js
          grep -Fq 'id="calculateBtn"' index.html
          grep -Fq 'calculate-primary' styles.css
          grep -Fq 'cbc_realistic_ballistics.js?v=20260815-4' index.html
          if grep -q 'REALISTIC_GAME_PITCH_CORRECTION' app.js; then exit 1; fi
          if grep -q 'syntheticRangeOffset' app.js; then exit 1; fi
          if grep -q 'barrelLength: Math.max(0, opts.length)' app.js; then exit 1; fi

      - name: Commit UI changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html styles.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add manual Calculate and coordinate-only seed inputs'
          git push
