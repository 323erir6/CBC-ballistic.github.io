name: Fix realistic trajectories

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Patch realistic solver
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          cbc_path = Path('cbc_realistic_ballistics.js')
          app_path = Path('app.js')
          index_path = Path('index.html')
          cbc = cbc_path.read_text(encoding='utf-8')
          app = app_path.read_text(encoding='utf-8')
          index = index_path.read_text(encoding='utf-8')

          marker = 'REALISTIC_MUZZLE_AND_TWO_ARCS_V1'
          if marker not in app:
              new_sim = r'''function sim(P,Y,S,T,V,c,pathOn){
                let y=Y*Math.PI/180,p=P*Math.PI/180,cp=Math.cos(p);
                let dir=[Math.sin(y)*cp,Math.sin(p),Math.cos(y)*cp];
                let v=[dir[0]*V,dir[1]*V,dir[2]*V];
                let L=Math.max(0,Number(c.barrelLength)||0);
                let x=[S[0]+dir[0]*L,S[1]+dir[1]*L,S[2]+dir[2]*L];
                let dx=T[0]-S[0],dz=T[2]-S[2],R=Math.hypot(dx,dz);
                if(!(R>0))return{ok:false,yError:Infinity,crossError:Infinity,ticks:-1,path:null};
                let ux=dx/R,uz=dz/R,rx=uz,rz=-ux;
                let path=pathOn?[{x:0,y:0}]:null;
                if(pathOn&&L>0)path.push({x:Math.hypot(x[0]-S[0],x[2]-S[2]),y:x[1]-S[1]});
                let pa=(x[0]-S[0])*ux+(x[2]-S[2])*uz,px=[...x];
                if(pa>=R)return{ok:false,yError:Infinity,crossError:Infinity,ticks:-1,path};
                let mx=Math.min(20000,Math.max(1,c.maxTicks||2000));
                for(let t=0;t<mx;t++){
                  let a=ac(x,v,t,c),n=[x[0]+v[0]+a[0]*.5,x[1]+v[1]+a[1]*.5,x[2]+v[2]+a[2]*.5];
                  let q=(n[0]-S[0])*ux+(n[2]-S[2])*uz;
                  if(pathOn)path.push({x:Math.hypot(n[0]-S[0],n[2]-S[2]),y:n[1]-S[1]});
                  if(q>=R&&pa<R){
                    let f=(R-pa)/Math.max(1e-12,q-pa);
                    let hit=[lr(px[0],n[0],f),lr(px[1],n[1],f),lr(px[2],n[2],f)];
                    return{ok:true,yError:hit[1]-T[1],crossError:(hit[0]-T[0])*rx+(hit[2]-T[2])*rz,ticks:t+f,position:hit,path};
                  }
                  pa=q;px=x;x=n;v=[v[0]+a[0],v[1]+a[1],v[2]+a[2]];
                  if(t>10&&x[1]<Math.min(S[1],T[1])-512&&v[1]<0)break;
                }
                return{ok:false,yError:Infinity,crossError:Infinity,ticks:-1,path};
              }'''

              new_solve = r'''function refinePitchBracket(lo,hi,B,S,T,V,c){
                let a=sim(lo,B,S,T,V,c,false),b=sim(hi,B,S,T,V,c,false);
                if(!a.ok||!b.ok)return(lo+hi)*.5;
                if(Math.abs(a.yError)<1e-8)return lo;
                if(Math.abs(b.yError)<1e-8)return hi;
                for(let i=0;i<20;i++){
                  let mid=(lo+hi)*.5,m=sim(mid,B,S,T,V,c,false);
                  if(!m.ok)break;
                  if(Math.abs(m.yError)<1e-8)return mid;
                  if(a.yError*m.yError<=0){hi=mid;b=m}else{lo=mid;a=m}
                }
                return(lo+hi)*.5;
              }
              function solve(S,T,V,c,arc){
                let dx=T[0]-S[0],dz=T[2]-S[2],R=Math.hypot(dx,dz);
                if(!(R>0)||!(V>0))return{ok:false,low:null,high:null,selected:null};
                let B=Math.atan2(dx,dz)*180/Math.PI;
                let minPitch=Math.max(-89,Number.isFinite(c.minPitch)?c.minPitch:-30);
                let maxPitch=Math.min(89,Number.isFinite(c.maxPitch)?c.maxPitch:89);
                if(!(maxPitch>minPitch))return{ok:false,low:null,high:null,selected:null};
                let step=.25,s=[];
                for(let p=minPitch;p<=maxPitch+1e-9;p+=step){
                  let pp=Math.min(p,maxPitch),q=sim(pp,B,S,T,V,c,false);
                  if(q.ok&&Number.isFinite(q.yError))s.push({pitch:pp,error:q.yError});
                  if(pp===maxPitch)break;
                }
                let roots=[];
                for(let i=0;i<s.length;i++){
                  let a=s[i];
                  if(Math.abs(a.error)<1e-5)roots.push(a.pitch);
                  if(i===0)continue;
                  let b=s[i-1];
                  if(b.error*a.error<0)roots.push(refinePitchBracket(b.pitch,a.pitch,B,S,T,V,c));
                }
                roots.sort((a,b)=>a-b);
                roots=roots.filter((p,i)=>i===0||Math.abs(p-roots[i-1])>.02);
                if(!roots.length&&s.length){
                  let best=s.reduce((a,b)=>Math.abs(a.error)<=Math.abs(b.error)?a:b);
                  let candidate=rf(best.pitch,B,S,T,V,c);
                  if(candidate&&candidate.miss<=Math.max(1,c.allowedMiss||1))roots.push(candidate.pitchDeg);
                }
                let r=roots.map(p=>rf(p,B,S,T,V,c)).filter(Boolean).sort((a,b)=>a.pitchDeg-b.pitchDeg);
                r=r.filter((v,i)=>i===0||Math.abs(v.pitchDeg-r[i-1].pitchDeg)>.02);
                if(!r.length)return{ok:false,low:null,high:null,selected:null};
                let low=r[0],high=r.length>1?r[r.length-1]:null;
                let selected=arc==="high"?high:low;
                return{ok:Boolean(selected&&selected.miss<=Math.max(1,c.allowedMiss||1)),low,high,selected};
              }'''

              new_sr = r'''function sr(P,Y,S,V,c){
                let p=P*Math.PI/180,y=Y*Math.PI/180,cp=Math.cos(p);
                let dir=[Math.sin(y)*cp,Math.sin(p),Math.cos(y)*cp];
                let v=[dir[0]*V,dir[1]*V,dir[2]*V];
                let L=Math.max(0,Number(c.barrelLength)||0);
                let x=[S[0]+dir[0]*L,S[1]+dir[1]*L,S[2]+dir[2]*L],pr=[...x];
                let mx=Math.min(20000,Math.max(1,c.maxTicks||2000));
                for(let t=0;t<mx;t++){
                  let a=ac(x,v,t,c),n=[x[0]+v[0]+a[0]*.5,x[1]+v[1]+a[1]*.5,x[2]+v[2]+a[2]*.5];
                  if(t>0&&n[1]<=S[1]){
                    let den=pr[1]-n[1];
                    let f=Math.abs(den)>1e-12?(pr[1]-S[1])/den:0;
                    f=Math.max(0,Math.min(1,f));
                    let xx=lr(pr[0],n[0],f),z=lr(pr[2],n[2],f);
                    return{range:Math.hypot(xx-S[0],z-S[2]),ticks:t+f};
                  }
                  pr=x;x=n;v=[v[0]+a[0],v[1]+a[1],v[2]+a[2]];
                }
                return{range:NaN,ticks:-1};
              }'''

              cbc, n = re.subn(r'function sim\(P,Y,S,T,V,c,pathOn\)\{.*?\}\nfunction rf', new_sim + '\nfunction rf', cbc, count=1, flags=re.S)
              if n != 1: raise SystemExit('Could not replace realistic sim()')
              cbc, n = re.subn(r'function solve\(S,T,V,c,arc\)\{.*?\}\nfunction sr', new_solve + '\nfunction sr', cbc, count=1, flags=re.S)
              if n != 1: raise SystemExit('Could not replace realistic solve()')
              cbc, n = re.subn(r'function sr\(P,Y,S,V,c\)\{.*?\}\nfunction maximumRange', new_sr + '\nfunction maximumRange', cbc, count=1, flags=re.S)
              if n != 1: raise SystemExit('Could not replace realistic sr()')

              old = '  const amaxLimit = calculatorType === "mianbao" ? 89 : 60;'
              if old not in app: raise SystemExit('Could not patch realistic maximum pitch')
              app = app.replace(old, '  const realisticMode = calculatorType === "cbc" && $("method")?.value === "realistic";\n  const amaxLimit = calculatorType === "mianbao" || realisticMode ? 89 : 60;', 1)

              old = '    solidFraction: num("solidFraction"),\n    windEnabled:'
              if old not in app: raise SystemExit('Could not add realistic barrel length')
              app = app.replace(old, '    solidFraction: num("solidFraction"),\n    barrelLength: Math.max(0, opts.length),\n    windEnabled:', 1)

              old = 'if ($("method")) $("method").addEventListener("change", () => {\n  if ($("method").value === "realistic") syncRealisticProjectileDefaults();'
              if old not in app: raise SystemExit('Could not patch realistic method listener')
              app = app.replace(old, 'if ($("method")) $("method").addEventListener("change", () => {\n  if ($("method").value === "realistic") {\n    syncRealisticProjectileDefaults();\n    if (num("amax") === 60) $("amax").value = 89;\n  } else if (num("amax") === 89) {\n    $("amax").value = 60;\n  }', 1)

              app = app.replace('source: "CBC Realistic Ballistics 1.3.2 browser port",', 'source: "CBC Realistic Ballistics 1.3.3 browser port",', 1)
              app = app.replace('note: "Matches the mod\'s static seed-derived wind and aerodynamic trajectory model.",', 'note: "Matches the mod trajectory model. Flight begins at the muzzle computed from cannon coordinates, solved yaw/pitch and total cannon length.",', 1)
              app = app.replace('"use strict";', '"use strict";\n// REALISTIC_MUZZLE_AND_TWO_ARCS_V1', 1)

              index = index.replace('cbc_realistic_ballistics.js?v=20260815-4', 'cbc_realistic_ballistics.js?v=20260820-5')
              index = index.replace('app.js?v=20260815-5', 'app.js?v=20260820-5')

              cbc_path.write_text(cbc, encoding='utf-8')
              app_path.write_text(app, encoding='utf-8')
              index_path.write_text(index, encoding='utf-8')
          else:
              print('Patch already present; validating only.')
          PY

      - name: Validate JavaScript and realistic solver
        shell: bash
        run: |
          node --check cbc_realistic_ballistics.js
          node --check app.js
          grep -q 'REALISTIC_MUZZLE_AND_TWO_ARCS_V1' app.js
          node <<'NODE'
          global.window = global;
          require('./cbc_realistic_ballistics.js');
          const B = global.CBCRealisticBallistics;
          const p = B.projectileDefaults('createbigcannons:ap_shell');
          const cfg = {
            worldSeed:'0',seedSalt:'0',dimensionId:'minecraft:overworld',windEnabled:false,weatherAffectsWind:false,weather:'clear',
            windSpeed:0,rainWindBonus:0,thunderWindBonus:0,gustSpeed:0,rainGustBonus:0,thunderGustBonus:0,windRegionSize:2048,
            windSpeedVariation:0,altitudeWindMultiplier:1,windDirection:0,windDirectionVariation:0,verticalTurbulence:0,
            seaLevelY:64,biomeTemperature:.8,scaleHeight:8500,cd:p.cd,diameter:p.diameter,referenceMass:p.referenceMass,
            projectileDensity:7800,lengthCalibers:3,solidFraction:.5,gravity:9.80665,enableCoriolis:false,latitude:45,
            enableSpinDrift:false,spinDriftFactor:0,minPitch:-10,maxPitch:89,maxTicks:4000,allowedMiss:1,barrelLength:20
          };
          let found=null;
          for(const range of [100,200,300,400,500,700,900,1200,1500,2000]){
            const r=B.solve([0,64,0],[range,64,0],20,cfg,'high');
            if(r.low&&r.high&&r.high.pitchDeg>r.low.pitchDeg+.1){found={range,low:r.low.pitchDeg,high:r.high.pitchDeg,selected:r.selected?.pitchDeg};break;}
          }
          if(!found)throw new Error('No two-arc validation case found');
          if(Math.abs(found.selected-found.high)>1e-4)throw new Error('HIGH did not select upper trajectory');
          console.log('Two-arc test:',found);
          const a=B.solve([0,64,0],[500,64,0],20,{...cfg,barrelLength:0},'low');
          const b=B.solve([0,64,0],[500,64,0],20,{...cfg,barrelLength:50},'low');
          if(!a.low||!b.low||Math.abs(a.low.pitchDeg-b.low.pitchDeg)<1e-5)throw new Error('50 m barrel did not change solution');
          console.log('Muzzle-offset test:',{zero:a.low.pitchDeg,fifty:b.low.pitchDeg});
          NODE

      - name: Commit patched calculator to PR branch
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cbc_realistic_ballistics.js app.js index.html
          git commit -m 'Fix realistic high arc search and muzzle position'
          git push origin HEAD:${{ github.head_ref }}

# PR trigger marker
