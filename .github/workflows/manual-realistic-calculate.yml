name: Apply manual realistic calculation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-realistic-calculate.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch calculator UI behaviour
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app_path = Path('app.js')
          index_path = Path('index.html')
          app = app_path.read_text(encoding='utf-8')
          index = index_path.read_text(encoding='utf-8')

          marker = 'REALISTIC_MANUAL_ONLY_20260820_V1'
          if marker in app:
              print('Patch already applied.')
              raise SystemExit(0)

          # Coordinate fields were registered twice, creating duplicate input/change listeners.
          duplicate_coords = '''// add coordinate-related fields so changes re-render
          fields.push("useCoords", "cannonX", "cannonY", "cannonZ", "targetX", "targetY", "targetZ");

          '''
          if duplicate_coords not in app:
              raise SystemExit('Duplicate coordinate fields block not found')
          app = app.replace(duplicate_coords, '', 1)

          # Replace the two duplicate updateInputMode() functions with one implementation.
          update_input_mode = r'''function updateInputMode() {
            const use = $("useCoords") && $("useCoords").checked;
            const distEl = $("distance") ? $("distance").parentElement : null;
            const heightEl = $("heightDelta") ? $("heightDelta").parentElement : null;
            const coordsEl = $("coordsGroup");

            // Seed-dependent controls are meaningful only when absolute world
            // coordinates are supplied. Hide them completely in distance mode.
            document.querySelectorAll(".seed-coordinate-only").forEach((el) => {
              el.style.display = use && isRealisticMode() ? "" : "none";
            });

            const worldSeedEl = $("worldSeed");
            if (worldSeedEl) {
              worldSeedEl.disabled = !use;
              worldSeedEl.title = use ? "" : "Available only in coordinate mode";
            }
            const windSeedSaltEl = $("windSeedSalt");
            if (windSeedSaltEl) {
              windSeedSaltEl.disabled = !use;
              windSeedSaltEl.title = use ? "" : "Available only in coordinate mode";
            }

            if (use) {
              if (distEl) distEl.style.display = "none";
              if (heightEl) heightEl.style.display = "none";
              if (coordsEl) coordsEl.style.display = "";
            } else {
              if (distEl) distEl.style.display = "";
              if (heightEl) heightEl.style.display = "";
              if (coordsEl) coordsEl.style.display = "none";
            }
          }'''

          pattern = re.compile(r'function updateInputMode\(\) \{.*?\n\}\n\nfunction updateInputMode\(\) \{.*?\n\}', re.S)
          app, n = pattern.subn(update_input_mode, app, count=1)
          if n != 1:
              raise SystemExit('Could not replace duplicate updateInputMode functions')

          # Distance mode must not consume user seed values even if values remain in DOM.
          old = '    worldSeed: $("worldSeed").value,'
          new = '    worldSeed: opts.useCoords ? $("worldSeed").value : "0",'
          if old not in app:
              raise SystemExit('worldSeed config line not found')
          app = app.replace(old, new, 1)

          old = '    seedSalt: $("windSeedSalt").value,'
          new = '    seedSalt: opts.useCoords ? $("windSeedSalt").value : "0",'
          if old not in app:
              raise SystemExit('windSeedSalt config line not found')
          app = app.replace(old, new, 1)

          # In CBC Realistic mode, input changes must perform ZERO ballistic work.
          # They only invalidate the previous result and wait for Calculate.
          old_helper = '''// REALISTIC_CALCULATOR_FIX_20260820_V3
          function isRealisticMode() {
            return $("calculatorType")?.value === "cbc" && $("method")?.value === "realistic";
          }

          function renderAfterInputChange() {
            if (isRealisticMode()) {
              clearOutputs();
              setStatus(t("calculate"), "");
              drawTrajectory(null, collectOptions());
              return;
            }
            render();
          }'''
          new_helper = '''// REALISTIC_CALCULATOR_FIX_20260820_V3
          // REALISTIC_MANUAL_ONLY_20260820_V1
          function isRealisticMode() {
            return $("calculatorType")?.value === "cbc" && $("method")?.value === "realistic";
          }

          function clearTrajectoryForPendingCalculation() {
            const canvas = $("trajectory");
            if (!canvas) return;
            const ctx = canvas.getContext("2d");
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#07090b";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#8c96a6";
            ctx.fillText(t("calculate"), 24, 34);
          }

          function renderAfterInputChange() {
            if (isRealisticMode()) {
              clearOutputs();
              setStatus(t("calculate"), "");
              clearTrajectoryForPendingCalculation();
              return;
            }
            render();
          }'''
          if old_helper not in app:
              raise SystemExit('Realistic helper block not found')
          app = app.replace(old_helper, new_helper, 1)

          # Hidden Mianbao controls must also respect manual Realistic mode if an
          # event is fired programmatically or by browser state restoration.
          app = app.replace('''if ($("rocketLauncher")) $("rocketLauncher").addEventListener("change", () => {
            fillRocketModes();
            render();
          });''', '''if ($("rocketLauncher")) $("rocketLauncher").addEventListener("change", () => {
            fillRocketModes();
            renderAfterInputChange();
          });''', 1)
          app = app.replace('''if ($("rocketMode")) $("rocketMode").addEventListener("change", () => {
            syncRocketModeDefaults();
            render();
          });''', '''if ($("rocketMode")) $("rocketMode").addEventListener("change", () => {
            syncRocketModeDefaults();
            renderAfterInputChange();
          });''', 1)

          # Mark both seed controls as coordinate-only in the UI.
          old = '''            <label>
              <span data-i18n="worldSeed">World seed</span>
              <input id="worldSeed" type="text" inputmode="numeric" value="0">
              <small data-i18n="worldSeedHint">Required for the exact static wind field</small>
            </label>'''
          new = '''            <label id="worldSeedField" class="seed-coordinate-only">
              <span data-i18n="worldSeed">World seed</span>
              <input id="worldSeed" type="text" inputmode="numeric" value="0">
              <small data-i18n="worldSeedHint">Required for the exact static wind field</small>
            </label>'''
          if old not in index:
              raise SystemExit('World seed field not found')
          index = index.replace(old, new, 1)

          old = '<label class="method-realistic"><span>Wind seed salt</span><input id="windSeedSalt" type="text" inputmode="numeric" value="0"></label>'
          new = '<label class="method-realistic seed-coordinate-only"><span>Wind seed salt</span><input id="windSeedSalt" type="text" inputmode="numeric" value="0"></label>'
          if old not in index:
              raise SystemExit('Wind seed salt field not found')
          index = index.replace(old, new, 1)

          index = re.sub(r'cbc_realistic_ballistics\.js\?v=[^"\']+', 'cbc_realistic_ballistics.js?v=20260820-6', index, count=1)
          index = re.sub(r'app\.js\?v=[^"\']+', 'app.js?v=20260820-6', index, count=1)

          app_path.write_text(app, encoding='utf-8')
          index_path.write_text(index, encoding='utf-8')
          print('Manual Realistic calculation patch applied.')
          PY

      - name: Validate
        shell: bash
        run: |
          node --check app.js
          grep -q 'REALISTIC_MANUAL_ONLY_20260820_V1' app.js
          grep -q 'worldSeed: opts.useCoords ?' app.js
          grep -q 'seedSalt: opts.useCoords ?' app.js
          grep -q 'class="seed-coordinate-only"' index.html
          grep -q 'method-realistic seed-coordinate-only' index.html
          if grep -q 'drawTrajectory(null, collectOptions())' app.js; then
            echo 'Realistic input changes still draw/recalculate.'
            exit 1
          fi
          COUNT=$(grep -c '^function updateInputMode()' app.js)
          test "$COUNT" -eq 1

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html
          git commit -m 'Make CBC Realistic calculation manual-only'
          git push
