name: Apply manual realistic calculation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-realistic-calculate.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch app and UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app_path = Path('app.js')
          index_path = Path('index.html')
          app = app_path.read_text(encoding='utf-8')
          index = index_path.read_text(encoding='utf-8')

          marker = 'REALISTIC_MANUAL_ONLY_20260820_V1'
          if marker not in app:
              # Remove duplicated coordinate listener registration.
              app = app.replace(
                  '// add coordinate-related fields so changes re-render\nfields.push("useCoords", "cannonX", "cannonY", "cannonZ", "targetX", "targetY", "targetZ");\n\n',
                  '',
                  1
              )

              # Collapse the duplicated input-mode functions into one.
              new_mode = '''function updateInputMode() {
            const use = $("useCoords") && $("useCoords").checked;
            const distEl = $("distance") ? $("distance").parentElement : null;
            const heightEl = $("heightDelta") ? $("heightDelta").parentElement : null;
            const coordsEl = $("coordsGroup");

            document.querySelectorAll(".seed-coordinate-only").forEach((el) => {
              el.style.display = use && isRealisticMode() ? "" : "none";
            });

            const worldSeedEl = $("worldSeed");
            if (worldSeedEl) worldSeedEl.disabled = !use;
            const windSeedSaltEl = $("windSeedSalt");
            if (windSeedSaltEl) windSeedSaltEl.disabled = !use;

            if (use) {
              if (distEl) distEl.style.display = "none";
              if (heightEl) heightEl.style.display = "none";
              if (coordsEl) coordsEl.style.display = "";
            } else {
              if (distEl) distEl.style.display = "";
              if (heightEl) heightEl.style.display = "";
              if (coordsEl) coordsEl.style.display = "none";
            }
          }'''
              app, n = re.subn(
                  r'function updateInputMode\(\) \{.*?\n\}\n\nfunction updateInputMode\(\) \{.*?\n\}',
                  new_mode,
                  app,
                  count=1,
                  flags=re.S
              )
              if n != 1:
                  raise SystemExit('Could not replace duplicate updateInputMode()')

              app = app.replace(
                  '    worldSeed: $("worldSeed").value,',
                  '    worldSeed: opts.useCoords ? $("worldSeed").value : "0",',
                  1
              )
              app = app.replace(
                  '    seedSalt: $("windSeedSalt").value,',
                  '    seedSalt: opts.useCoords ? $("windSeedSalt").value : "0",',
                  1
              )

              old = '''// REALISTIC_CALCULATOR_FIX_20260820_V3
          function isRealisticMode() {
            return $("calculatorType")?.value === "cbc" && $("method")?.value === "realistic";
          }

          function renderAfterInputChange() {
            if (isRealisticMode()) {
              clearOutputs();
              setStatus(t("calculate"), "");
              drawTrajectory(null, collectOptions());
              return;
            }
            render();
          }'''
              new = '''// REALISTIC_CALCULATOR_FIX_20260820_V3
          // REALISTIC_MANUAL_ONLY_20260820_V1
          function isRealisticMode() {
            return $("calculatorType")?.value === "cbc" && $("method")?.value === "realistic";
          }

          function clearTrajectoryForPendingCalculation() {
            const canvas = $("trajectory");
            if (!canvas) return;
            const ctx = canvas.getContext("2d");
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#07090b";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#8c96a6";
            ctx.fillText(t("calculate"), 24, 34);
          }

          function renderAfterInputChange() {
            if (isRealisticMode()) {
              clearOutputs();
              setStatus(t("calculate"), "");
              clearTrajectoryForPendingCalculation();
              return;
            }
            render();
          }'''
              if old not in app:
                  raise SystemExit('Realistic input helper not found')
              app = app.replace(old, new, 1)

              app = app.replace(
                  'fillRocketModes();\n  render();\n});\nif ($("rocketMode"))',
                  'fillRocketModes();\n  renderAfterInputChange();\n});\nif ($("rocketMode"))',
                  1
              )
              app = app.replace(
                  'syncRocketModeDefaults();\n  render();\n});\ndocument.querySelectorAll("[data-lang]")',
                  'syncRocketModeDefaults();\n  renderAfterInputChange();\n});\ndocument.querySelectorAll("[data-lang]")',
                  1
              )

          # Hide seed controls outside coordinate mode.
          if 'id="worldSeedField"' not in index:
              index = index.replace(
                  '<label>\n              <span data-i18n="worldSeed">World seed</span>',
                  '<label id="worldSeedField" class="seed-coordinate-only">\n              <span data-i18n="worldSeed">World seed</span>',
                  1
              )
          index = index.replace(
              '<label class="method-realistic"><span>Wind seed salt</span><input id="windSeedSalt"',
              '<label class="method-realistic seed-coordinate-only"><span>Wind seed salt</span><input id="windSeedSalt"',
              1
          )
          index = re.sub(r'cbc_realistic_ballistics\.js\?v=[^"\']+', 'cbc_realistic_ballistics.js?v=20260820-6', index, count=1)
          index = re.sub(r'app\.js\?v=[^"\']+', 'app.js?v=20260820-6', index, count=1)

          app_path.write_text(app, encoding='utf-8')
          index_path.write_text(index, encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          node --check app.js
          grep -q 'REALISTIC_MANUAL_ONLY_20260820_V1' app.js
          grep -Fq 'worldSeed: opts.useCoords ? $("worldSeed").value : "0"' app.js
          grep -Fq 'seedSalt: opts.useCoords ? $("windSeedSalt").value : "0"' app.js
          grep -q 'id="worldSeedField" class="seed-coordinate-only"' index.html
          grep -q 'method-realistic seed-coordinate-only' index.html
          test "$(grep -c '^function updateInputMode()' app.js)" -eq 1
          if grep -q 'drawTrajectory(null, collectOptions())' app.js; then exit 1; fi

      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No patch needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html
          git commit -m 'Make CBC Realistic calculation manual-only'
          git push
